name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11.13'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install --no-build-isolation -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q
      - run: quantization-quality-lab verify > /tmp/replay.json
      - run: python -m build --no-isolation
      - name: Installed wheel smoke test
        run: |
          python -m venv /tmp/wheel-smoke
          /tmp/wheel-smoke/bin/pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/wheel-smoke/bin/quantization-quality-lab verify --root "$GITHUB_WORKSPACE" > /tmp/wheel-replay.json
